[versions] # pinned dependency and plugin versions
agp = "8.9.1" # Android Gradle Plugin version
kotlin = "2.1.20" # Kotlin compiler and plugins
ksp = "2.1.20-1.0.32" # KSP aligned with Kotlin 2.1.20
hilt = "2.56.2" # Dagger Hilt Android
hiltNavigationCompose = "1.2.0" # androidx.hilt:hilt-navigation-compose for hiltViewModel()
coreKtx = "1.15.0" # androidx.core:core-ktx
coreSplashscreen = "1.0.1" # androidx.core:core-splashscreen
lifecycle = "2.9.0" # AndroidX Lifecycle family
activityCompose = "1.10.1" # androidx.activity:activity-compose
composeBom = "2025.05.00" # Compose Bill of Materials
coroutines = "1.10.2" # kotlinx-coroutines-android
junit = "4.13.2" # JUnit 4
junitVersion = "1.2.1" # androidx.test.ext:junit
turbine = "1.2.0" # Cash App Turbine
coroutinesTest = "1.10.2" # kotlinx-coroutines-test
kover = "0.9.1" # Kotlinx Kover plugin
robolectric = "4.14.1" # Robolectric unit-test runtime
androidxTestCore = "1.6.1" # androidx.test:core-ktx

[libraries] # library coordinates referenced as libs.* in Gradle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" } # Kotlin extensions for Android core
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" } # SplashScreen API
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" } # Lifecycle runtime KTX
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" } # Lifecycle Compose helpers
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" } # Compose viewModel()
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" } # Activity Compose setContent
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" } # Compose BOM platform
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" } # Compose UI (version from BOM)
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" } # Compose graphics (version from BOM)
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" } # @Preview (version from BOM)
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" } # Material 3 (version from BOM)
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" } # Android coroutines
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" } # Hilt runtime for Application/Activity/ViewModel
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" } # Hilt annotation processor used via KSP
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" } # hiltViewModel() in Compose
junit = { group = "junit", name = "junit", version.ref = "junit" } # JUnit 4
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" } # AndroidX JUnit
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" } # coroutine test APIs
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" } # Flow assertion library
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" } # Compose preview tooling (debug)
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" } # Compose UI tests
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" } # Compose test manifest (debug)
androidx-lifecycle-runtime-testing = { group = "androidx.lifecycle", name = "lifecycle-runtime-testing", version.ref = "lifecycle" } # TestLifecycleOwner
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" } # JVM Android stubs
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" } # AndroidX test core KTX

[plugins] # Gradle plugins referenced as libs.plugins.*
android-application = { id = "com.android.application", version.ref = "agp" } # Android application plugin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" } # Kotlin Android plugin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Compose compiler plugin
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" } # Kover coverage plugin
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } # Hilt Gradle plugin
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" } # KSP plugin for Hilt
